# Mosquitto configuration — local development (no TLS)
# Phase 4 adds TLS configuration for port 8883.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_level information

# ─── Local dev listener (plain MQTT) ─────────────────────────────────────────
listener 1883
allow_anonymous true

# ─── Production listener (MQTTS with X.509 client certs) ─────────────────────
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
tls_version tlsv1.2
