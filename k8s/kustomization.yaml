# ─────────────────────────────────────────────────────────────────────────────
# SIGS-RS Kustomize entry point
#
# Apply the entire stack:
#   kubectl apply -k k8s/
#
# Or apply individual resources:
#   kubectl apply -f k8s/namespace.yaml
#   ...
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sigs-rs

resources:
  - namespace.yaml
  - configmap.yaml
  - secret-template.yaml   # Template only — replace values before applying
  - redis.yaml
  - timescaledb.yaml
  - mosquitto.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
