# ─────────────────────────────────────────────────────────────────────────────
# SIGS-RS Gateway Services
#
# Two Services:
#   sigs-rs-gateway       — ClusterIP (internal access / Ingress backend)
#   sigs-rs-gateway-lb    — LoadBalancer (optional; use for minikube tunnel)
# ─────────────────────────────────────────────────────────────────────────────

# ── Internal ClusterIP Service ─────────────────────────────────────────────
# This is the default. Route external traffic through an Ingress controller
# (nginx, traefik, etc.) pointing to this ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: sigs-rs-gateway
  namespace: sigs-rs
  labels:
    app.kubernetes.io/name: sigs-rs
    app.kubernetes.io/component: gateway
  annotations:
    # Allow Prometheus Operator to auto-discover this service.
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sigs-rs
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
