# ─────────────────────────────────────────────────────────────────────────────
# SIGS-RS Secret Template — FILL BEFORE APPLYING
#
# This file is a TEMPLATE only.  All placeholder values must be replaced
# before applying to a cluster.
#
# Do NOT commit real secrets to version control.
# Use a secrets manager (HashiCorp Vault, AWS Secrets Manager, Sealed Secrets,
# SOPS, External Secrets Operator) to inject real values at deploy time.
#
# How to create real secrets:
#   # Generate a strong JWT secret
#   JWT_KEY=$(openssl rand -hex 64)
#
#   # Apply with kubectl create secret (never stored in git)
#   kubectl create secret generic sigs-rs-secret \
#     --namespace=sigs-rs \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://sigs_user:<PASSWORD>@timescaledb:5432/sigs_db" \
#     --from-literal=POSTGRES_PASSWORD="<STRONG_DB_PASSWORD>" \
#     --from-literal=JWT_SECRET_KEY="${JWT_KEY}" \
#     --from-literal=ADMIN_USERNAME="admin" \
#     --from-literal=ADMIN_PASSWORD="<STRONG_ADMIN_PASSWORD>"
#
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: sigs-rs-secret
  namespace: sigs-rs
  labels:
    app.kubernetes.io/name: sigs-rs
    app.kubernetes.io/component: gateway
  annotations:
    # Remind operators this is a template
    sigs-rs/secret-template: "true"
type: Opaque
stringData:
  # ── Database credentials ───────────────────────────────────────────────────
  # MUST point to a non-production host (SRS REQ-SF-1).
  # 'timescaledb' is the Kubernetes Service name; it contains no blocked
  # keywords ('prod', 'production', 'live').
  DATABASE_URL: "postgresql+asyncpg://sigs_user:REPLACE_ME@timescaledb:5432/sigs_db"
  # Redis connection URL for shared rate-limiting state. For local/demo, use redis://redis:6379/0.
  REDIS_URL: "redis://redis:6379/0"

  # Used by the TimescaleDB StatefulSet directly
  POSTGRES_PASSWORD: "REPLACE_ME"

  # ── JWT authentication ─────────────────────────────────────────────────────
  # Generate with: openssl rand -hex 64
  JWT_SECRET_KEY: "REPLACE_ME_use_openssl_rand_hex_64"

  # ── Admin user ─────────────────────────────────────────────────────────────
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "REPLACE_ME"

  # ── MQTT TLS certificates (optional, for mqtts:// production transport) ───
  # Base64-encoded PEM certificate material.
  # Leave empty for plaintext MQTT (development only).
  # MQTT_CA_CERT: ""
  # MQTT_CLIENT_CERT: ""
  # MQTT_CLIENT_KEY: ""
