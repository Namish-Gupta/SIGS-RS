# ─────────────────────────────────────────────────────────────────────────────
# SIGS-RS Gateway Deployment
#
# Architecture notes:
#   - The gateway is stateless at the HTTP layer (queue, circuit breaker,
#     and sliding-window are per-pod in-process state).
#   - Horizontal scaling is safe for HTTP ingestion.
#   - MQTT: only ONE pod subscribes (MQTT_CLIENT_ID uniqueness).
#     All pods subscribe by default; Mosquitto delivers the same message to
#     all subscribers with the same topic — this causes duplicate DB writes.
#     To avoid this, set MQTT to a shared subscription ($share/sigs-rs/...).
#     See configmap.yaml comments for the sliding-window fan-out mitigation.
#   - The IngestionQueue, CircuitBreaker, and SlidingWindow are per-pod.
#   - The circuit breaker and fail_closed flag do NOT propagate across pods.
#
# SRS §2.4.1.2: Docker/Kubernetes readiness.
# SRS REQ-QA-1: liveness probe must trigger restart within 30 s.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigs-rs-gateway
  namespace: sigs-rs
  labels:
    app.kubernetes.io/name: sigs-rs
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "1.0.0"
spec:
  # Start with 2 replicas for HA. HPA controls scale beyond this.
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: sigs-rs
      app.kubernetes.io/component: gateway

  # Rolling update: always keep at least 1 pod available during rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sigs-rs
        app.kubernetes.io/component: gateway
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Force pod restart when the ConfigMap changes (checksum annotation pattern).
        # kubectl annotate deployment sigs-rs-gateway rollme=$(date +%s)
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"

    spec:
      # ── Security Context ──────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # ── Init Container ─────────────────────────────────────────────────────
      # Wait for TimescaleDB to be ready before the gateway starts.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for TimescaleDB..."
              until nc -z timescaledb 5432; do
                echo "  timescaledb:5432 not ready — sleeping 2s"
                sleep 2
              done
              echo "TimescaleDB is reachable."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: gateway
          # In production, pin this to a specific image digest, never 'latest'.
          # minikube: use 'minikube image build' and set imagePullPolicy: Never.
          image: sigs-rs-gateway:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # ── Resource limits ────────────────────────────────────────────────
          # Requests: guaranteed minimum (used by scheduler and HPA).
          # Limits:   hard ceiling.
          # The 75% CPU HPA target is relative to the request (250m).
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # ── Non-secret configuration ───────────────────────────────────────
          envFrom:
            - configMapRef:
                name: sigs-rs-config

          # ── Secret configuration ───────────────────────────────────────────
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sigs-rs-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sigs-rs-secret
                  key: REDIS_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sigs-rs-secret
                  key: JWT_SECRET_KEY

            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sigs-rs-secret
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sigs-rs-secret
                  key: ADMIN_PASSWORD

            # ── Unique MQTT client ID per pod ──────────────────────────────
            # Mosquitto kicks out any client that connects with an ID already
            # in use. Each pod needs a stable unique ID.
            # The downward API injects the pod name (e.g. sigs-rs-gateway-abc12).
            #
            # NOTE: With N pods all subscribing to 'telemetry/#', Mosquitto
            # delivers each MQTT message to ALL N subscribers — each pod will
            # independently queue and process the same packet, causing N
            # duplicate DB writes. Production deployments should either:
            #   a) Use MQTT shared subscriptions:
            #      MQTT_TOPIC_PREFIX: "$share/sigs-rs/telemetry/#"
            #      (requires Mosquitto 2.0+, disabled here for dev compat)
            #   b) Designate a single MQTT-subscriber pod (sidecar pattern).
            # In minikube/dev with 1 MQTT-capable pod this is a non-issue.
            - name: MQTT_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Expose pod name and namespace for structured log correlation
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # ── Readiness probe ────────────────────────────────────────────────
          # Removes the pod from Service endpoints if not ready to serve traffic.
          # Uses /ready which returns 503 when fail_closed=True or unhealthy.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5

          # ── Liveness probe ─────────────────────────────────────────────────
          # Restarts the pod if it enters fail-closed state or hangs.
          # /health returns HTTP 503 when fail_closed=True → K8s restarts.
          # SRS REQ-QA-1: restart must occur within 30 s of failure.
          # 10s initial + 3 failures × 10s period = 40s worst-case.
          # Reduced to 5s period to achieve < 30s restart window.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5

          # ── Startup probe ──────────────────────────────────────────────────
          # Prevents liveness from killing a slow-starting pod (DB migrations
          # can take a few seconds on first boot).
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # Allow up to 60s for startup
            timeoutSeconds: 5

          # ── Security context ───────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # ── Volume mounts (writable temp dir for Python bytecode cache) ────
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pycache
              mountPath: /app/src/sigs_rs/__pycache__

      volumes:
        - name: tmp
          emptyDir: {}
        - name: pycache
          emptyDir: {}

      # ── Pod disruption ──────────────────────────────────────────────────────
      terminationGracePeriodSeconds: 30

      # ── Pod anti-affinity ──────────────────────────────────────────────────
      # Prefer spreading pods across nodes for HA (soft rule, works on minikube).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sigs-rs
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
